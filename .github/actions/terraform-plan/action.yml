name: "Terraform Plan"
description: "Checks formatting, validates, optionally tests, plans, comments on the pull request, and uploads the encrypted saved plan."
inputs:
  github-token:
    required: true
    description: "Token used to comment on the pull request"
  deploy:
    required: true
    description: "true plans an apply, false plans a destroy"
  aws-region:
    required: true
    description: "AWS Region"
  environment:
    required: true
    description: "Environment name"
  init-outcome:
    required: true
    description: "Outcome of terraform init"
  secret-tfvars-file:
    required: false
    default: ""
    description: "Path to a variables file written from the secret-tfvars secret"
  pr-comment:
    required: false
    default: "true"
    description: "Post the plan as a pull request comment"
  run-terraform-test:
    required: false
    default: "false"
    description: "Run terraform test before the plan"
  upload-plan:
    required: false
    default: "false"
    description: "Upload the encrypted saved plan for the apply job"
  plan-encryption-key:
    required: false
    default: ""
    description: "Passphrase used to encrypt the saved plan"
  artifact-name:
    required: false
    default: "tfplan"
    description: "Name of the saved plan artifact"
outputs:
  exitcode:
    description: "terraform plan -detailed-exitcode result: 0 no changes, 1 error, 2 changes"
    value: ${{ steps.plan.outputs.exitcode }}
runs:
  using: "composite"
  steps:
    - name: Terraform Format and Style
      id: fmt
      continue-on-error: true
      shell: bash
      run: terraform fmt -check -diff -recursive -no-color 2>&1 | tee "$RUNNER_TEMP/terraform-fmt.txt"
    - name: Terraform Validate
      id: validate
      continue-on-error: true
      shell: bash
      run: terraform validate -no-color 2>&1 | tee "$RUNNER_TEMP/terraform-validate.txt"
    - name: Terraform Test
      id: test
      if: ${{ inputs.run-terraform-test == 'true' }}
      continue-on-error: true
      shell: bash
      run: terraform test -no-color 2>&1 | tee "$RUNNER_TEMP/terraform-test.txt"
    - name: Terraform Plan
      id: plan
      continue-on-error: true
      shell: bash
      env:
        DEPLOY: ${{ inputs.deploy }}
        ENVIRONMENT: ${{ inputs.environment }}
        AWS_REGION_INPUT: ${{ inputs.aws-region }}
        SECRET_TFVARS_FILE: ${{ inputs.secret-tfvars-file }}
        PLAN_FILE: ${{ runner.temp }}/tfplan
        PLAN_TEXT: ${{ runner.temp }}/terraform-plan.txt
      run: bash "$GITHUB_ACTION_PATH/plan.sh"
    - name: Comment Pull Request
      if: ${{ inputs.pr-comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        WORKFLOW_NAME: ${{ github.workflow }}
        ENVIRONMENT: ${{ inputs.environment }}
        AWS_REGION_INPUT: ${{ inputs.aws-region }}
        INIT_OUTCOME: ${{ inputs.init-outcome }}
        FMT_OUTCOME: ${{ steps.fmt.outcome }}
        VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        TEST_OUTCOME: ${{ steps.test.outcome }}
        PLAN_OUTCOME: ${{ steps.plan.outcome }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const path = require('path');
          const env = process.env;
          const read = (name) => {
            try { return fs.readFileSync(path.join(env.RUNNER_TEMP, name), 'utf8'); } catch { return ''; }
          };
          const cut = (text, limit) => text.length > limit ? `${text.substring(0, limit)}\n...` : text;
          const fence = '````';
          const details = (summary, text) =>
            `<details><summary>${summary}</summary>\n\n${fence}\n${text}\n${fence}\n\n</details>\n`;

          const marker = `<!-- terraform-reusable-workflow:${env.WORKFLOW_NAME}:${env.ENVIRONMENT}:${env.AWS_REGION_INPUT} -->`;
          const runUrl = `${env.GITHUB_SERVER_URL}/${env.GITHUB_REPOSITORY}/actions/runs/${env.GITHUB_RUN_ID}`;
          const plan = read('terraform-plan.txt');
          const planLimit = 55000;

          let body = `${marker}\n## ${env.WORKFLOW_NAME} - ${env.ENVIRONMENT} (${env.AWS_REGION_INPUT})\n`;
          body += `#### Terraform Format and Style 🖌 \`${env.FMT_OUTCOME}\`\n`;
          if (env.FMT_OUTCOME !== 'success') body += details('Format differences', cut(read('terraform-fmt.txt'), 3000));
          body += `#### Terraform Initialization ⚙️ \`${env.INIT_OUTCOME}\`\n`;
          body += `#### Terraform Validation 🤖 \`${env.VALIDATE_OUTCOME}\`\n`;
          body += details('Validation Output', cut(read('terraform-validate.txt'), 3000));
          if (env.TEST_OUTCOME) {
            body += `#### Terraform Test 🧪 \`${env.TEST_OUTCOME}\`\n`;
            body += details('Test Output', cut(read('terraform-test.txt'), 3000));
          }
          body += `#### Terraform Plan 📖 \`${env.PLAN_OUTCOME}\`\n`;
          body += details('Show Plan', cut(plan, planLimit));
          if (plan.length > planLimit) body += `The plan was truncated. Read the full plan in [Actions](${runUrl}).\n\n`;
          body += `*Pushed by: @${context.actor}, Action: \`${context.eventName}\`, Workflow: [${env.WORKFLOW_NAME}](${runUrl})*`;

          const comments = await github.paginate(github.rest.issues.listComments, {
            ...context.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });
          const existing = comments.find((c) => c.user.type === 'Bot' && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
          }
    - name: Encrypt saved plan
      if: ${{ inputs.upload-plan == 'true' && steps.plan.outputs.exitcode == '2' }}
      shell: bash
      env:
        PLAN_ENCRYPTION_KEY: ${{ inputs.plan-encryption-key }}
        PLAN_FILE: ${{ runner.temp }}/tfplan
        BUNDLE_FILE: ${{ runner.temp }}/tfplan-artifact/tfplan.tgz.gpg
      run: |
        mkdir -p "$(dirname "$BUNDLE_FILE")"
        bash "$GITHUB_ACTION_PATH/pack.sh"
    - name: Upload saved plan
      if: ${{ inputs.upload-plan == 'true' && steps.plan.outputs.exitcode == '2' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/tfplan-artifact/tfplan.tgz.gpg
        retention-days: 1
        if-no-files-found: error
        overwrite: true
    - name: Check results
      shell: bash
      env:
        FMT_OUTCOME: ${{ steps.fmt.outcome }}
        VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        TEST_OUTCOME: ${{ steps.test.outcome }}
        PLAN_OUTCOME: ${{ steps.plan.outcome }}
      run: |
        failed=()
        [[ "$FMT_OUTCOME" == "success" ]] || failed+=("terraform fmt")
        [[ "$VALIDATE_OUTCOME" == "success" ]] || failed+=("terraform validate")
        [[ -z "$TEST_OUTCOME" || "$TEST_OUTCOME" == "success" || "$TEST_OUTCOME" == "skipped" ]] || failed+=("terraform test")
        [[ "$PLAN_OUTCOME" == "success" ]] || failed+=("terraform plan")
        if (( ${#failed[@]} )); then
          echo "::error::Failed: ${failed[*]}"
          exit 1
        fi
