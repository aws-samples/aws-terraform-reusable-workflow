name: Terraform Reusable

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read # This is required for actions/checkout
  pull-requests: write # This is required to add comments to Pull Requests
  deployments: write # This is required to deactivate deployments

on:
  workflow_call:
    inputs:
      deploy: # true = 'terraform apply' false = 'terraform destroy'
        required: true
        type: boolean
      tf-version:
        required: true
        type: string
      tf-organization:
        required: false
        type: string
        description: "Terraform Cloud/Enterprise organization name"
      tf-hostname:
        required: false
        type: string
        description: "Terraform Cloud/Enterprise hostname"
      tf-workspace:
        required: false
        type: string
        description: "Terraform Cloud/Enterprise workspace name"
      aws-region:
        required: true
        type: string
      environment:
        required: true
        type: string
      ref:
        required: true
        type: string
      local-execution-mode:
        required: false
        type: boolean
      setup-python:
        required: false
        type: boolean
      python-version:
        required: false
        type: string
      # New input for GitHub module sourcing
      enable-github-modules:
        required: false
        type: boolean
        default: false
        description: "Enable sourcing modules from GitHub repositories"
    secrets:
      tf-token:
        required: false
        description: "Terraform Cloud/Enterprise API token"
      terraform-execution-iam-plan-role-arn:
        required: false
      terraform-execution-iam-apply-role-arn:
        required: false
      extra-args:
        required: false
      # New secret for GitHub module sourcing
      github-token:
        required: false
        description: "GitHub Personal Access Token for accessing private repositories"

concurrency:
  group: ${{ inputs.environment }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout composite actions
        uses: actions/checkout@v4
        with:
          repository: aws-samples/aws-terraform-reusable-workflow
          ref: ${{ inputs.ref }}
          path: composite
      # Set TF_* environment variables only if TFC/TFE is used
      - name: Set Terraform Cloud/Enterprise Environment Variables
        if: ${{ inputs.tf-organization != '' && inputs.tf-hostname != '' && inputs.tf-workspace != '' }}
        run: |
          echo "TF_CLOUD_ORGANIZATION=${{ inputs.tf-organization }}" >> $GITHUB_ENV
          echo "TF_CLOUD_HOSTNAME=${{ inputs.tf-hostname }}" >> $GITHUB_ENV
          echo "TF_WORKSPACE=${{ inputs.tf-workspace }}" >> $GITHUB_ENV
          echo "TF_TOKEN_app_terraform_io=${{ secrets.tf-token }}" >> $GITHUB_ENV
      - name: Terraform Init
        id: init
        uses: ./composite/.github/actions/terraform-init
        with:
          tf-version: ${{ inputs.tf-version }}
          aws-region: ${{ inputs.aws-region }}
          terraform-wrapper: true
          local-execution-mode: ${{ inputs.local-execution-mode }}
          terraform-execution-iam-role-arn: ${{ secrets.terraform-execution-iam-plan-role-arn }}
          setup-python: ${{ inputs.setup-python }}
          python-version: ${{ inputs.python-version }}
          enable-github-modules: ${{ inputs.enable-github-modules }}
          github-token: ${{ secrets.github-token }}
      - name: Terraform Plan
        id: plan
        uses: ./composite/.github/actions/terraform-plan
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy: ${{ inputs.deploy }}
          aws-region: ${{ inputs.aws-region }}
          environment: ${{ inputs.environment }}
          init-outcome: ${{ steps.init.outputs.outcome }}
          extra-args: ${{ secrets.extra-args }}
  terraform-apply:
    needs: [terraform-plan]
    name: Terraform Apply
    if: (github.ref_name == 'main' && needs.terraform-plan.outputs.exitcode == 2)
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout composite actions
        uses: actions/checkout@v4
        with:
          repository: aws-samples/aws-terraform-reusable-workflow
          ref: ${{ inputs.ref }}
          path: composite
      # Set TF_* environment variables only if TFC/TFE is used
      - name: Set Terraform Cloud/Enterprise Environment Variables
        if: ${{ inputs.tf-organization != '' && inputs.tf-hostname != '' && inputs.tf-workspace != '' }}
        run: |
          echo "TF_CLOUD_ORGANIZATION=${{ inputs.tf-organization }}" >> $GITHUB_ENV
          echo "TF_CLOUD_HOSTNAME=${{ inputs.tf-hostname }}" >> $GITHUB_ENV
          echo "TF_WORKSPACE=${{ inputs.tf-workspace }}" >> $GITHUB_ENV
          echo "TF_TOKEN_app_terraform_io=${{ secrets.tf-token }}" >> $GITHUB_ENV
      - name: Terraform Init
        id: init
        uses: ./composite/.github/actions/terraform-init
        with:
          tf-version: ${{ inputs.tf-version }}
          aws-region: ${{ inputs.aws-region }}
          terraform-wrapper: false
          local-execution-mode: ${{ inputs.local-execution-mode }}
          terraform-execution-iam-role-arn: ${{ secrets.terraform-execution-iam-apply-role-arn }}
          setup-python: ${{ inputs.setup-python }}
          python-version: ${{ inputs.python-version }}
          enable-github-modules: ${{ inputs.enable-github-modules }}
          github-token: ${{ secrets.github-token }}
      - name: Define Terraform Apply Command # 'terraform apply' or 'terraform destroy'
        id: tf_apply_command
        run: |
          if ${{ inputs.deploy }}
          then
            echo "APPLY_COMMAND=terraform apply" >> $GITHUB_OUTPUT
          else
            echo "APPLY_COMMAND=terraform destroy" >> $GITHUB_OUTPUT
          fi
      - name: Terraform Apply
        run: |
          ${{ steps.tf_apply_command.outputs.APPLY_COMMAND }} \
            -var-file=envs/${{ inputs.environment }}/terraform.tfvars \
            -var="region=${{ inputs.aws-region }}" \
            -var="environment=${{ inputs.environment }}" \
            -auto-approve \
            -input=false \
            ${{ secrets.extra-args }}

  deactivate-deployment:
    needs: [terraform-apply]
    if: ${{ ! inputs.deploy }}
    name: Deactivate Deployment
    runs-on: ubuntu-latest
    steps:
      - uses: strumwolf/delete-deployment-environment@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: ${{ inputs.environment }}
          onlyDeactivateDeployments: true
